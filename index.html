<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GerinGonça</title>
<meta name="description" content="Jogo de física em que você monta geringonças para uma gata debochada e um cachorro bobo se atrapalharem, se zoarem e, um dia, virarem amigos.">
<meta name="theme-color" content="#e0563b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GerinGonça">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* layout: tabuleiro largo à esquerda, estante de peças à direita; no celular tudo empilha */
  :root {
    --bg: #efe3cf; --panel: #fff9ee; --ink: #2b2118; --muted: #7a6a58; --line: #e2d3b8;
    --accent: #e0563b; --accent-ink: #fff; --ok: #3a9d5d; --warn: #d9a12b; --shadow: 0 8px 24px rgba(60, 40, 10, .14);
    --chip: #f7efe0; --chip-line: #e6d6b8; --dark-card: #2b2118; --dark-ink: #fff5e4;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1f1a15; --panel: #2a241d; --ink: #f3e9d7; --muted: #b7a891; --line: #3c3327; --accent: #ff6f50; --chip: #33291f; --chip-line: #4a3d2e; --shadow: 0 8px 24px rgba(0,0,0,.4); --dark-card: #15110d; color-scheme: dark;
  } }
  :root[data-theme="dark"] { --bg: #1f1a15; --panel: #2a241d; --ink: #f3e9d7; --muted: #b7a891; --line: #3c3327; --accent: #ff6f50; --chip: #33291f; --chip-line: #4a3d2e; --shadow: 0 8px 24px rgba(0,0,0,.4); --dark-card: #15110d; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; }
  h1 { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 28px; margin: 0; letter-spacing: .3px; line-height: 1; }
  h1 .g { color: var(--accent); } h1 .c { color: #5f6b7a; }
  .lvl { font-family: Fredoka, sans-serif; font-size: 17px; font-weight: 500; color: var(--muted); }
  .goal { background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px; padding: 6px 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .goal .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
  .spacer { flex: 1; }
  button { font: inherit; font-weight: 800; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 8px 14px; cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  button:hover { filter: brightness(.97); } button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-size: 16px; padding: 10px 20px; }
  button.icon { padding: 8px 10px; min-width: 40px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; padding: 0 16px 16px; align-items: start; }
  .board-wrap { position: relative; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 10px; min-width: 0; }
  canvas#board { width: 100%; height: auto; display: block; border-radius: 12px; touch-action: none; cursor: default; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; min-height: 42px; }
  .toolbar .sel { color: var(--muted); font-weight: 600; margin-right: auto; min-width: 0; } .toolbar .sel b { color: var(--ink); }
  aside { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; position: sticky; top: 10px; min-width: 0; }
  aside h2 { font-family: Fredoka, sans-serif; font-weight: 500; font-size: 18px; margin: 4px 6px 10px; }
  .inv { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--chip-line); background: var(--chip); border-radius: 12px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
  .item canvas { width: 56px; height: 44px; flex: none; }
  .item .name { font-weight: 800; font-size: 14px; } .item .desc { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .item .count { margin-left: auto; font-family: Fredoka, sans-serif; font-size: 20px; min-width: 32px; text-align: center; background: var(--panel); border-radius: 10px; padding: 2px 6px; }
  .item.empty { opacity: .4; cursor: not-allowed; } .item.armed { outline: 3px solid var(--accent); }
  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.35; } .hint b { color: var(--ink); }
  .msg { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); background: rgba(43,33,24,.85); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 800; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .msg.show { opacity: 1; }
  .overlay { position: fixed; inset: 0; background: rgba(30,20,10,.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.show { display: flex; }
  .card { background: var(--panel); border-radius: 20px; padding: 22px 24px; max-width: 560px; width: 100%; box-shadow: var(--shadow); text-align: center; max-height: 90vh; overflow: auto; }
  .card h2 { font-family: Fredoka, sans-serif; font-weight: 700; font-size: 30px; margin: 0 0 8px; text-wrap: balance; }
  .card p { color: var(--muted); margin: 6px 0 16px; line-height: 1.45; font-size: 16px; }
  .card p.story { color: var(--ink); font-size: 18px; }
  .card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card .obj { display: inline-block; background: var(--chip); border: 1px solid var(--chip-line); border-radius: 999px; padding: 6px 14px; font-weight: 800; margin-bottom: 14px; }
  #failOverlay { background: rgba(20,12,6,.35); align-items: flex-start; padding-top: 12vh; cursor: pointer; }
  .fail { background: var(--dark-card); color: var(--dark-ink); border-radius: 18px; padding: 18px 26px; max-width: 620px; box-shadow: 0 12px 40px rgba(0,0,0,.4); text-align: center; transform: rotate(-1.5deg); }
  .fail h3 { font-family: Fredoka, sans-serif; font-size: 26px; margin: 0; line-height: 1.25; text-wrap: balance; }
  .fail p { margin: 8px 0 0; opacity: .75; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; text-align: left; }
  .grid .acth { grid-column: 1 / -1; font-family: Fredoka, sans-serif; color: var(--muted); margin-top: 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
  .grid button { padding: 10px 12px; font-size: 14px; position: relative; text-align: left; }
  .grid button.done { border-color: var(--ok); } .grid button.done::after { content: '✓'; position: absolute; top: 4px; right: 8px; font-size: 12px; color: var(--ok); }
  .grid button.current { background: var(--accent); color: #fff; }
  .how { text-align: left; font-size: 14px; line-height: 1.5; padding-left: 20px; } .how li { margin: 4px 0; }
  kbd { background: var(--chip); border: 1px solid var(--chip-line); border-radius: 6px; padding: 0 6px; font-family: inherit; font-weight: 800; }
  .winbar { display: none; gap: 8px; align-items: center; margin-top: 10px; padding: 10px 12px; background: var(--chip); border: 1px solid var(--chip-line); border-radius: 12px; flex-wrap: wrap; }
  .winbar.show { display: flex; }
  .winbar .narr { font-weight: 800; margin-right: auto; min-width: 0; }
  .loadtrack { height: 10px; background: var(--chip); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
  .loadbar { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } aside { position: static; } .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); } }
  @media (max-width: 520px) { h1 { font-size: 22px; } .lvl { display: none; } header { gap: 8px; padding: 8px 12px; } main { padding: 0 12px 12px; } .board-wrap { padding: 6px; border-radius: 12px; } .card h2 { font-size: 24px; } }
  @media (prefers-reduced-motion: reduce) { .msg { transition: none; } }
</style>
</head>
<body>
<header>
  <h1><span class="g">Gerin</span><span class="c">Gonça</span></h1>
  <div class="lvl" id="lvlTitle">Fase 1</div>
  <div class="goal"><span class="dot"></span><span id="goalText"></span></div>
  <div class="spacer"></div>
  <button id="btnLevels">Fases</button>
  <button id="btnHelp">Como joga?</button>
  <button id="btnReset">Limpar</button>
  <button id="btnPlay" class="primary">▶ Testar</button>
</header>
<main>
  <div class="board-wrap">
    <canvas id="board" width="2400" height="800"></canvas>
    <div class="msg" id="msg"></div>
    <div class="toolbar">
      <span class="sel" id="selInfo"></span>
      <button class="icon" id="btnRotL" title="Girar 5° pra esquerda (Shift+R)">↺</button>
      <button class="icon" id="btnRotR" title="Girar 5° pra direita (R)">↻</button>
      <button class="icon" id="btnFlip" title="Inverter (F)">⇄</button>
      <button class="icon" id="btnDel" title="Devolver peça (Delete)">🗑</button>
    </div>
    <div class="winbar" id="winbar"><span class="narr" id="winNarr"></span><button id="btnReplay">De novo</button><button id="btnEditAfterWin">Mexer nas peças</button><button id="btnNext" class="primary">Próxima fase →</button></div>
  </div>
  <aside>
    <h2>Suas peças</h2>
    <div class="inv" id="inv"></div>
    <div class="hint" id="hint"></div>
  </aside>
</main>

<div class="overlay" id="introOverlay"><div class="card">
  <h2 id="introTitle">Fase 1</h2>
  <p class="story" id="introText"></p>
  <div class="obj" id="introGoal"></div>
  <div class="row"><button id="btnIntroGo" class="primary">Bora</button></div>
</div></div>

<div class="overlay" id="failOverlay"><div class="fail"><h3 id="failText"></h3><p id="failTip"></p></div></div>

<div class="overlay" id="winOverlay"><div class="card">
  <h2 id="winTitle">Deu certo.</h2>
  <p class="story" id="winText"></p>
  <div class="row"><button id="btnCloseWin">Fechar</button></div>
</div></div>

<div class="overlay show" id="loadOverlay"><div class="card"><h2>GerinGonça</h2><p>Carregando os bichos e a bagunça…</p><div class="loadtrack"><div class="loadbar" id="loadBar"></div></div></div></div>

<div class="overlay" id="levelsOverlay"><div class="card">
  <h2>Fases</h2>
  <p>Uma história em cinco atos. As concluídas ficam marcadas.</p>
  <div class="grid" id="levelGrid"></div>
  <div class="row"><button id="btnCloseLevels">Fechar</button></div>
</div></div>

<div class="overlay" id="helpOverlay"><div class="card">
  <h2>Como joga?</h2>
  <ul class="how">
    <li>Arrasta. Encaixa. Mira.</li>
    <li>Não tem botão de começar.</li>
    <li>O resto é com você.</li>
  </ul>
  <div class="row"><button id="btnCloseHelp" class="primary">Entendi</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="sprites.js"></script>
<script src="atlas.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
